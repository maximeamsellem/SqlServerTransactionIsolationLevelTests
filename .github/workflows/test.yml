name: test

on:
  push:
    branches: ["main"]    
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:  

env:
  dotnet-version: 8.0.x

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
        
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
    
    - name: Configure .NET SDK ${{ env.dotnet-version }}
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.dotnet-version }}
        secrets: inherit
        
    - name: .NET Restore      
      run: dotnet restore

    - name: .NET Build
      run: dotnet build --no-restore
      
    - name: .NET Test
      run: dotnet test